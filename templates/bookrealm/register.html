{% extends 'bookrealm/bootstrap-base.html' %}
{% load static %}

{% block body_block %}
<section class="d-flex flex-column align-items-center justify-content-center py-5" style="min-height: 90vh;">
    <div class="text-center mb-4">
        <h2 class="text-white fw-bold mt-3">Create Account</h2>
        <p class="text-secondary">Join millions of book lovers worldwide</p>
    </div>

    <div class="rr-filter-box p-4 p-md-5 rounded-4 shadow-lg" style="width: 100%; max-width: 500px;">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label class="text-white small fw-bold mb-2">Username</label>
                <input type="text" name="username" class="form-control rr-search-input" placeholder="FunnyReader123" required>
            </div>
            <div class="mb-3">
                <label class="text-white small fw-bold mb-2">Email</label>
                <input type="email" name="email" class="form-control rr-search-input" placeholder="you@example.com" required>
            </div>

            <div class="mb-3">
                <label class="text-white small fw-bold mb-2">Profile Picture</label>
                <input type="file" name="picture" class="form-control rr-search-input" accept="image/*">
            </div>

            <div class="mb-3">
                <label class="text-white small fw-bold mb-2">Password</label>
                <input type="password" name="password" class="form-control rr-search-input" placeholder="********" required>
            </div>

            <div class="mb-4">
                <label class="text-white small fw-bold mb-2 d-block">Account Type</label>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="account_type" id="reader" value="reader" checked>
                    <label class="form-check-label text-white" for="reader">Reader - I want to discover books</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="account_type" id="author" value="author">
                    <label class="form-check-label text-white" for="author">Author - I want to publish books</label>
                </div>
            </div>

            <button type="submit" class="btn rr-btn-red w-100 py-2 fw-bold">Create Account</button>
            <p class="text-center text-secondary mt-4 mb-0">
                Already have an account? <a href="{% url 'BookRealm:login' %}" class="rr-link-red fw-bold">Log in</a>
            </p>
        </form>
    </div>
</section>

<style>
    .form-check-input:checked { background-color: var(--rr-red); border-color: var(--rr-red); }
    /* Rende il selettore file più coerente con il design */
    input[type="file"]::file-selector-button {
        background-color: #2a2a2a;
        color: white;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 2px 10px;
        margin-right: 10px;
        cursor: pointer;
    }
</style>
{% endblock %}
