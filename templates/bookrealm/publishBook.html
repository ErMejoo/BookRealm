{% extends 'bookrealm/bootstrap-base.html' %}
{% load static %}

{% block title_block %}Publish Book{% endblock %}

{% block body_block %}

<section class="px-4 py-5">
    <div class="container-fluid">

        <h1 class="fw-bold text-white mb-4">Publish a Book</h1>

        <div class="rr-review-form p-4 rounded">

            <form method="POST">
                {% csrf_token %}

                <!-- Title -->
                <p class="fw-semibold text-white">Book Title</p>
                <input type="text" name="title"
                       class="form-control rr-search-input mb-3"
                       required>

                <!-- Description -->
                <p class="fw-semibold text-white">Description</p>
                <textarea name="description"
                          class="form-control rr-review-textarea mb-3"
                          rows="4"></textarea>

                <!-- Pages -->
                <p class="fw-semibold text-white">Pages</p>
                <input type="number" name="numPages"
                       class="form-control rr-search-input mb-3">

                <!-- ISBN -->
                <p class="fw-semibold text-white">ISBN</p>
                <input type="text" name="isbn"
                       class="form-control rr-search-input mb-3">

                <!-- Genre -->
                <p class="fw-semibold text-white">Genre</p>
                <select name="genre"
                        class="form-select rr-search-input mb-4">
                    {% for genre in genres %}
                        <option value="{{ genre.id }}">{{ genre.name }}</option>
                    {% endfor %}
                </select>

                <button type="submit" class="btn rr-btn-red px-4">
                    Publish
                </button>

            </form>

        </div>

    </div>
</section>

{% endblock %}
