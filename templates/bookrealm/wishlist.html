<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist</title>
</head>
<body>
    <h1>My Wishlist</h1>

    {% if wishlist_items %}
        <ul>
            {% for item in wishlist_items %}
                <li>
                    <strong>{{ item.book.title }}</strong> - {{ item.book.description }}
                    <a href="{% url 'BookRealm:remove_from_wishlist' item.book.id %}">Remove</a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Your wishlist is empty.</p>
    {% endif %}
</body>
</html>
